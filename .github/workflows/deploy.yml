name: VeriRAG CI and EC2 CodeDeploy

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'app.py'
      - 'evaluate.py'
      - 'Dockerfile.backend'
      - 'Dockerfile.frontend'
      - 'pyproject.toml'
      - 'requirements*.txt'
      - 'deployment/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: verirag-main-release
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 372806411232.dkr.ecr.ap-south-1.amazonaws.com
  BACKEND_IMAGE: verirag-backend
  FRONTEND_IMAGE: verirag-frontend

jobs:
  eval-gate:
    name: DeepEval Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      # Restore an approved fixed baseline, not a moving cache baseline.
      # If evaluate.py expects eval_baseline.json, commit the approved file or retrieve it from a versioned artifact/S3.
      - name: Require approved evaluation baseline
        run: test -s eval_baseline.json || { echo "Missing approved eval_baseline.json" >&2; exit 1; }
      - name: Run evaluation regression pipeline
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_PROJECT: VeriRAG-CI
          LANGSMITH_TRACING: 'true'
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_BASE_URL: https://us.cloud.langfuse.com
        run: python evaluate.py --ci
      - name: Upload evaluation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results-${{ github.sha }}
          path: |
            eval_results.json
            eval_summary.md
          if-no-files-found: warn
          retention-days: 30

  build:
    name: Build and Push ECR Images
    runs-on: ubuntu-latest
    needs: eval-gate
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push images tagged with commit SHA
        shell: bash
        run: |
          set -euo pipefail
          docker build -f Dockerfile.backend -t "$ECR_REGISTRY/$BACKEND_IMAGE:$GITHUB_SHA" .
          docker push "$ECR_REGISTRY/$BACKEND_IMAGE:$GITHUB_SHA"
          docker build -f Dockerfile.frontend -t "$ECR_REGISTRY/$FRONTEND_IMAGE:$GITHUB_SHA" .
          docker push "$ECR_REGISTRY/$FRONTEND_IMAGE:$GITHUB_SHA"

  package-revisions:
    name: Package and Upload CodeDeploy Revisions
    needs: build
    runs-on: ubuntu-latest
    outputs:
      backend_key: ${{ steps.keys.outputs.backend_key }}
      frontend_key: ${{ steps.keys.outputs.frontend_key }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify AppSpec and scripts
        shell: bash
        run: |
          set -euo pipefail
          for svc in backend frontend; do
            dir="deployment/codedeploy/$svc"
            test -f "$dir/appspec.yml"
            test -f "$dir/$svc-compose.yml"
            for script in preflight configure start validate; do
              test -f "$dir/scripts/$script.sh"
              bash -n "$dir/scripts/$script.sh"
            done
          done
      - name: Create separate revision ZIPs (AppSpec at ZIP root)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/revisions"
          for svc in backend frontend; do
            dir="deployment/codedeploy/$svc"
            printf 'IMAGE_TAG=%s\n' "$GITHUB_SHA" > "$dir/release.env"
            (cd "$dir" && zip -q -r "$RUNNER_TEMP/revisions/$svc-$GITHUB_SHA.zip" appspec.yml "$svc-compose.yml" scripts release.env)
            unzip -l "$RUNNER_TEMP/revisions/$svc-$GITHUB_SHA.zip"
          done
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Upload revision bundles to S3
        shell: bash
        env:
          BUCKET: ${{ vars.CODEDEPLOY_S3_BUCKET }}
        run: |
          set -euo pipefail
          test -n "$BUCKET" || { echo 'Set CODEDEPLOY_S3_BUCKET repo variable' >&2; exit 1; }
          for svc in backend frontend; do
            aws s3 cp "$RUNNER_TEMP/revisions/$svc-$GITHUB_SHA.zip" \
              "s3://$BUCKET/verirag/$GITHUB_SHA/$svc.zip" \
              --region "$AWS_REGION"
          done
      - name: Set revision S3 keys
        id: keys
        run: |
          echo "backend_key=verirag/$GITHUB_SHA/backend.zip" >> "$GITHUB_OUTPUT"
          echo "frontend_key=verirag/$GITHUB_SHA/frontend.zip" >> "$GITHUB_OUTPUT"

  deploy-backend:
    name: Deploy Backend EC2
    if: ${{ vars.ENABLE_CODEDEPLOY == 'true' }}
    needs: package-revisions
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy backend revision
        shell: bash
        env:
          BUCKET: ${{ vars.CODEDEPLOY_S3_BUCKET }}
          APP: ${{ vars.CODEDEPLOY_APP }}
          GROUP: ${{ vars.CODEDEPLOY_BACKEND_GROUP }}
          KEY: ${{ needs.package-revisions.outputs.backend_key }}
        run: |
          set -euo pipefail
          : "${BUCKET:?Missing CODEDEPLOY_S3_BUCKET}"
          : "${APP:?Missing CODEDEPLOY_APP}"
          : "${GROUP:?Missing CODEDEPLOY_BACKEND_GROUP}"
          deployment_id="$(aws deploy create-deployment \
            --application-name "$APP" \
            --deployment-group-name "$GROUP" \
            --s3-location "bucket=$BUCKET,key=$KEY,bundleType=zip" \
            --description "Backend $GITHUB_SHA" \
            --query deploymentId --output text)"
          echo "Backend deployment: $deployment_id"
          aws deploy wait deployment-successful --deployment-id "$deployment_id"

  deploy-frontend:
    name: Deploy Frontend EC2
    if: ${{ vars.ENABLE_CODEDEPLOY == 'true' }}
    needs: [package-revisions, deploy-backend]
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy frontend revision
        shell: bash
        env:
          BUCKET: ${{ vars.CODEDEPLOY_S3_BUCKET }}
          APP: ${{ vars.CODEDEPLOY_APP }}
          GROUP: ${{ vars.CODEDEPLOY_FRONTEND_GROUP }}
          KEY: ${{ needs.package-revisions.outputs.frontend_key }}
        run: |
          set -euo pipefail
          : "${BUCKET:?Missing CODEDEPLOY_S3_BUCKET}"
          : "${APP:?Missing CODEDEPLOY_APP}"
          : "${GROUP:?Missing CODEDEPLOY_FRONTEND_GROUP}"
          deployment_id="$(aws deploy create-deployment \
            --application-name "$APP" \
            --deployment-group-name "$GROUP" \
            --s3-location "bucket=$BUCKET,key=$KEY,bundleType=zip" \
            --description "Frontend $GITHUB_SHA" \
            --query deploymentId --output text)"
          echo "Frontend deployment: $deployment_id"
          aws deploy wait deployment-successful --deployment-id "$deployment_id"
