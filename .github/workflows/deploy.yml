
name: VeriRAG CI and EC2 CodeDeploy

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'app.py'
      - 'generate_eval_dataset.py'
      - 'evaluate_rag_app.py'
      - 'evaluate.py'
      - 'mlflow_tracking.py'
      - 'execute_experiment_pipeline.py'
      - 'params.yaml'
      - 'config/**'
      - 'data/evaluation/goldens/**'
      - 'reports/evaluation/attention_metrics_k3_baseline.json'
      - 'documents/Attention_Is_All_You_Need.pdf'
      - 'Dockerfile.backend'
      - 'Dockerfile.frontend'
      - 'pyproject.toml'
      - 'requirements*.txt'
      - 'deployment/**'
      - '.github/workflows/deploy.yml'

      # Do not trigger for documentation-only changes
      - '!**/*.md'
      - '!**/*.MD'

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: verirag-main-release
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 372806411232.dkr.ecr.ap-south-1.amazonaws.com
  BACKEND_IMAGE: verirag-backend
  FRONTEND_IMAGE: verirag-frontend

jobs:

  # =========================================================
  # 1. DEEPEVAL QUALITY GATE
  # =========================================================

  eval-gate:
    name: DeepEval Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Validate the new YAML/Pydantic configuration.
      - name: Validate experiment configuration
        run: python -m config.parameter_config

      # These assets are approved and reused on every run.
      # CI must never regenerate or overwrite the baseline.
      - name: Verify approved evaluation assets
        shell: bash
        run: |
          set -euo pipefail

          test -s data/evaluation/goldens/attention_goldens.json
          test -s reports/evaluation/attention_metrics_k3_baseline.json
          test -s documents/Attention_Is_All_You_Need.pdf

          echo "Approved golden dataset found."
          echo "Fixed baseline report found."
          echo "Research PDF found."

      # Retrieval k is currently hardcoded to 3 in rag_graph.py.
      # Prevent misleading experiment configurations.
      - name: Verify retrieval configuration
        shell: bash
        run: |
          python - <<'PY'
          from config.parameter_config import params_config

          assert params_config.rag_app.k == 3, (
              "CI currently requires k=3 because backend "
              "retrieval is fixed to k=3."
          )

          print("Retrieval configuration verified: k=3")
          PY

      # Remove any tracked/stale candidate outputs before generating.
      # This does NOT remove goldens or approved baseline.
      - name: Prepare fresh evaluation outputs
        shell: bash
        run: |
          set -euo pipefail

          rm -f data/evaluation/eval_dataset/attention_eval_dataset.json
          rm -f reports/evaluation/attention_metrics.json
          rm -f reports/evaluation/regression_summary.md

          mkdir -p data/evaluation/eval_dataset
          mkdir -p reports/evaluation

      - name: Generate fresh RAG evaluation dataset
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}

          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}

          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_PROJECT: VeriRAG-CI
          LANGSMITH_TRACING: 'true'

          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_BASE_URL: https://us.cloud.langfuse.com

        run: |
          python generate_eval_dataset.py

      - name: Verify freshly generated evaluation dataset
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path(
              "data/evaluation/eval_dataset/attention_eval_dataset.json"
          )

          assert path.is_file(), "Evaluation dataset missing"

          cases = json.loads(path.read_text(encoding="utf-8"))

          assert len(cases) == 10, (
              f"Expected 10 evaluation cases, got {len(cases)}"
          )

          for index, case in enumerate(cases, start=1):
              assert case.get("actual_output"), (
                  f"Case {index}: missing actual answer"
              )

              assert case.get("retrieval_context"), (
                  f"Case {index}: missing retrieval context"
              )

              assert case.get("route") == "retrieve", (
                  f"Case {index}: expected retrieve route"
              )

          print("Fresh dataset verified: 10 retrieval cases")
          PY

      # Run all 7 DeepEval metrics using the configured judge.
      - name: Run DeepEval quality evaluation
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_PROJECT: VeriRAG-CI
          LANGSMITH_TRACING: 'true'

          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_BASE_URL: https://us.cloud.langfuse.com

        run: |
          python evaluate_rag_app.py

      - name: Verify fresh metric report
        shell: bash
        run: |
          test -s reports/evaluation/attention_metrics.json

      # Compare against the approved fixed baseline.
      # Exit code 1 blocks downstream build and deployment.
      - name: Run DeepEval regression comparison
        shell: bash
        run: |
          python evaluate.py --ci --tolerance 0.15

      # Save reports even if earlier evaluation steps fail.
      - name: Upload evaluation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results-${{ github.sha }}
          path: |
            data/evaluation/eval_dataset/attention_eval_dataset.json
            reports/evaluation/attention_metrics.json
            reports/evaluation/regression_summary.md
          if-no-files-found: warn
          retention-days: 30

  # =========================================================
  # 2. BUILD AND PUSH DOCKER IMAGES
  # =========================================================

  build:
    name: Build and Push ECR Images
    runs-on: ubuntu-latest
    needs: eval-gate

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push images tagged with commit SHA
        shell: bash
        run: |
          set -euo pipefail

          docker build \
            -f Dockerfile.backend \
            -t "$ECR_REGISTRY/$BACKEND_IMAGE:$GITHUB_SHA" .

          docker push "$ECR_REGISTRY/$BACKEND_IMAGE:$GITHUB_SHA"

          docker build \
            -f Dockerfile.frontend \
            -t "$ECR_REGISTRY/$FRONTEND_IMAGE:$GITHUB_SHA" .

          docker push "$ECR_REGISTRY/$FRONTEND_IMAGE:$GITHUB_SHA"

  # =========================================================
  # 3. PACKAGE CODEDEPLOY REVISIONS
  # =========================================================

  package-revisions:
    name: Package and Upload CodeDeploy Revisions
    needs: build
    runs-on: ubuntu-latest

    outputs:
      backend_key: ${{ steps.keys.outputs.backend_key }}
      frontend_key: ${{ steps.keys.outputs.frontend_key }}

    steps:
      - uses: actions/checkout@v4

      - name: Verify AppSpec and scripts
        shell: bash
        run: |
          set -euo pipefail

          for svc in backend frontend; do
            dir="deployment/codedeploy/$svc"

            test -f "$dir/appspec.yml"
            test -f "$dir/$svc-compose.yml"

            for script in preflight configure start validate; do
              test -f "$dir/scripts/$script.sh"
              bash -n "$dir/scripts/$script.sh"
            done
          done

      - name: Create separate revision ZIPs
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/revisions"

          for svc in backend frontend; do
            dir="deployment/codedeploy/$svc"

            printf 'IMAGE_TAG=%s\n' "$GITHUB_SHA" > "$dir/release.env"

            (
              cd "$dir" && zip -q -r \
                "$RUNNER_TEMP/revisions/$svc-$GITHUB_SHA.zip" \
                appspec.yml "$svc-compose.yml" scripts release.env
            )

            unzip -l \
              "$RUNNER_TEMP/revisions/$svc-$GITHUB_SHA.zip"
          done

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload revision bundles to S3
        shell: bash
        env:
          BUCKET: ${{ vars.CODEDEPLOY_S3_BUCKET }}
        run: |
          set -euo pipefail

          test -n "$BUCKET" || {
            echo 'Set CODEDEPLOY_S3_BUCKET repo variable' >&2
            exit 1
          }

          for svc in backend frontend; do
            aws s3 cp \
              "$RUNNER_TEMP/revisions/$svc-$GITHUB_SHA.zip" \
              "s3://$BUCKET/verirag/$GITHUB_SHA/$svc.zip" \
              --region "$AWS_REGION"
          done

      - name: Set revision S3 keys
        id: keys
        run: |
          echo "backend_key=verirag/$GITHUB_SHA/backend.zip" >> "$GITHUB_OUTPUT"
          echo "frontend_key=verirag/$GITHUB_SHA/frontend.zip" >> "$GITHUB_OUTPUT"

  # =========================================================
  # 4. DEPLOY BACKEND
  # =========================================================

  deploy-backend:
    name: Deploy Backend EC2
    if: ${{ vars.ENABLE_CODEDEPLOY == 'true' }}
    needs: package-revisions
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy backend revision
        shell: bash
        env:
          BUCKET: ${{ vars.CODEDEPLOY_S3_BUCKET }}
          APP: ${{ vars.CODEDEPLOY_APP }}
          GROUP: ${{ vars.CODEDEPLOY_BACKEND_GROUP }}
          KEY: ${{ needs.package-revisions.outputs.backend_key }}
        run: |
          set -euo pipefail

          : "${BUCKET:?Missing CODEDEPLOY_S3_BUCKET}"
          : "${APP:?Missing CODEDEPLOY_APP}"
          : "${GROUP:?Missing CODEDEPLOY_BACKEND_GROUP}"

          deployment_id="$(aws deploy create-deployment \
            --application-name "$APP" \
            --deployment-group-name "$GROUP" \
            --s3-location "bucket=$BUCKET,key=$KEY,bundleType=zip" \
            --description "Backend $GITHUB_SHA" \
            --query deploymentId --output text)"

          echo "Backend deployment: $deployment_id"

          aws deploy wait deployment-successful \
            --deployment-id "$deployment_id"

  # =========================================================
  # 5. DEPLOY FRONTEND
  # =========================================================

  deploy-frontend:
    name: Deploy Frontend EC2
    if: ${{ vars.ENABLE_CODEDEPLOY == 'true' }}
    needs: [package-revisions, deploy-backend]
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy frontend revision
        shell: bash
        env:
          BUCKET: ${{ vars.CODEDEPLOY_S3_BUCKET }}
          APP: ${{ vars.CODEDEPLOY_APP }}
          GROUP: ${{ vars.CODEDEPLOY_FRONTEND_GROUP }}
          KEY: ${{ needs.package-revisions.outputs.frontend_key }}
        run: |
          set -euo pipefail

          : "${BUCKET:?Missing CODEDEPLOY_S3_BUCKET}"
          : "${APP:?Missing CODEDEPLOY_APP}"
          : "${GROUP:?Missing CODEDEPLOY_FRONTEND_GROUP}"

          deployment_id="$(aws deploy create-deployment \
            --application-name "$APP" \
            --deployment-group-name "$GROUP" \
            --s3-location "bucket=$BUCKET,key=$KEY,bundleType=zip" \
            --description "Frontend $GITHUB_SHA" \
            --query deploymentId --output text)"

          echo "Frontend deployment: $deployment_id"

          aws deploy wait deployment-successful \
            --deployment-id "$deployment_id"
