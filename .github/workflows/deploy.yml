name: Deploy to EKS

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "app.py"
      - "evaluate.py"                  # ← ADD: eval logic change triggers gate
      - "Dockerfile.backend"
      - "Dockerfile.frontend"
      - "pyproject.toml"
      - "requirements.txt"
      - "requirements-backend.txt"     # ← ADD: backend deps change triggers build
      - "requirements-frontend.txt"    # ← ADD: if you have this file
      - "k8s/**"
      # NOT triggered by:
      # README.md, docs/, *.md, interview docs, .gitignore

env:
  AWS_REGION:       ${{ secrets.AWS_REGION }}
  ECR_REGISTRY:     ${{ secrets.ECR_REGISTRY }}
  BACKEND_IMAGE:    verirag-backend
  FRONTEND_IMAGE:   verirag-frontend
  EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME }}

jobs:

  # ═══════════════════════════════════════════════════════════════════════════
  # Job 1 — DeepEval Quality Gate
  # ═══════════════════════════════════════════════════════════════════════════
  eval-gate:
    name: DeepEval Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore eval baseline
        uses: actions/cache@v4
        with:
          path: eval_baseline.json
          key: eval-baseline-${{ github.ref_name }}
          restore-keys: |
            eval-baseline-main
            eval-baseline-

      - name: Run evaluation regression pipeline
        env:
          OPENAI_API_KEY:    ${{ secrets.OPENAI_API_KEY }}
          QDRANT_URL:        ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY:    ${{ secrets.QDRANT_API_KEY }}
          TAVILY_API_KEY:    ${{ secrets.TAVILY_API_KEY }}
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_PROJECT: VeriRAG-CI
          LANGSMITH_TRACING: "true"
        run: python evaluate.py --ci

      - name: Upload evaluation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results-${{ github.sha }}
          path: |
            eval_results.json
            eval_summary.md
          retention-days: 30

      - name: Save updated baseline
        if: success()
        uses: actions/cache/save@v4
        with:
          path: eval_baseline.json
          key: eval-baseline-${{ github.ref_name }}-${{ github.sha }}

  # ═══════════════════════════════════════════════════════════════════════════
  # Job 2 — Build & Push Docker Images
  # ═══════════════════════════════════════════════════════════════════════════
  build:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: eval-gate

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        run: |
          docker build \
            -f Dockerfile.backend \
            -t $ECR_REGISTRY/$BACKEND_IMAGE:$GITHUB_SHA \
            -t $ECR_REGISTRY/$BACKEND_IMAGE:latest \
            .
          docker push $ECR_REGISTRY/$BACKEND_IMAGE:$GITHUB_SHA
          docker push $ECR_REGISTRY/$BACKEND_IMAGE:latest

      - name: Build and push frontend image
        run: |
          docker build \
            -f Dockerfile.frontend \
            -t $ECR_REGISTRY/$FRONTEND_IMAGE:$GITHUB_SHA \
            -t $ECR_REGISTRY/$FRONTEND_IMAGE:latest \
            .
          docker push $ECR_REGISTRY/$FRONTEND_IMAGE:$GITHUB_SHA
          docker push $ECR_REGISTRY/$FRONTEND_IMAGE:latest

  # ═══════════════════════════════════════════════════════════════════════════
  # Job 3 — Deploy to EKS
  # ═══════════════════════════════════════════════════════════════════════════
  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region $AWS_REGION \
            --name $EKS_CLUSTER_NAME

      - name: Deploy to EKS
        run: |
          kubectl set image deployment/verirag-backend \
            backend=$ECR_REGISTRY/$BACKEND_IMAGE:$GITHUB_SHA \
            -n verirag

          kubectl set image deployment/verirag-frontend \
            frontend=$ECR_REGISTRY/$FRONTEND_IMAGE:$GITHUB_SHA \
            -n verirag

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/verirag-backend  -n verirag --timeout=120s
          kubectl rollout status deployment/verirag-frontend -n verirag --timeout=120s
