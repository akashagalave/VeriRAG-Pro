# k8s/monitoring.yml
# ─────────────────────────────────────────────────────────────────────────────
# VeriRAG Monitoring Stack — Prometheus + Grafana
#
# Deploys to the 'verirag' namespace alongside the main application.
#
# What this file creates:
#   - ConfigMap: Prometheus scrape configuration (scrapes /metrics on FastAPI pods)
#   - ConfigMap: Grafana datasource auto-provisioning
#   - Deployment: Prometheus (scrapes FastAPI /metrics every 15s)
#   - Deployment: Grafana (dashboard server)
#   - Service: prometheus-service (ClusterIP — internal only)
#   - Service: grafana-service (ClusterIP — access via kubectl port-forward)
#
# Access Grafana locally:
#   kubectl port-forward svc/grafana-service 3000:3000 -n verirag
#   Open: http://localhost:3000  (admin / verirag-grafana)
#
# Prometheus UI locally:
#   kubectl port-forward svc/prometheus-service 9090:9090 -n verirag
#   Open: http://localhost:9090
# ─────────────────────────────────────────────────────────────────────────────

---
# ── Prometheus ConfigMap ──────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: verirag
data:
  prometheus.yml: |
    global:
      scrape_interval:     15s
      evaluation_interval: 15s
      external_labels:
        cluster: 'verirag-eks'

    scrape_configs:

      # ── VeriRAG FastAPI backend ───────────────────────────────────────────
      - job_name: 'verirag-backend'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: ['verirag']
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: verirag-backend
            action: keep
          - source_labels: [__meta_kubernetes_pod_ip]
            target_label: __address__
            replacement: '${1}:8000'
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node

      # ── Prometheus self-monitoring ────────────────────────────────────────
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

    # ── Alerting rules ────────────────────────────────────────────────────────
    rule_files:
      - /etc/prometheus/alerts.yml

  alerts.yml: |
    groups:
      - name: verirag-alerts
        rules:

          # High error rate
          - alert: VeriRAGHighErrorRate
            expr: |
              rate(verirag_error_count_total[5m]) > 0.1
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "VeriRAG error rate > 0.1/s for 2 minutes"
              description: "Error type: {{ $labels.error_type }}"

          # p95 latency > 30s
          - alert: VeriRAGHighLatency
            expr: |
              histogram_quantile(0.95,
                rate(verirag_request_latency_seconds_bucket[5m])
              ) > 30
            for: 3m
            labels:
              severity: warning
            annotations:
              summary: "VeriRAG p95 latency > 30s"

          # Circuit breaker open
          - alert: VeriRAGCircuitBreakerOpen
            expr: |
              verirag_circuit_breaker_open == 1
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "LLM provider circuit breaker OPEN: {{ $labels.provider }}"
              description: "Requests are being routed to fallback providers"

          # Pod down
          - alert: VeriRAGPodDown
            expr: |
              up{job="verirag-backend"} == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "VeriRAG backend pod unreachable"

---
# ── Grafana Datasource ConfigMap ──────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: verirag
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        url: http://prometheus-service:9090
        access: proxy
        isDefault: true
        jsonData:
          timeInterval: "15s"

---
# ── Prometheus Deployment ─────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: verirag
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus-sa
      containers:
        - name: prometheus
          image: prom/prometheus:v2.51.0
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--storage.tsdb.retention.time=7d"
            - "--web.enable-lifecycle"
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: storage
              mountPath: /prometheus
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: storage
          emptyDir: {}   # Use PVC in production for persistence

---
# ── Prometheus RBAC ───────────────────────────────────────────────────────────
# Allows Prometheus to discover pods via Kubernetes Service Discovery
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus-sa
  namespace: verirag

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus-role
rules:
  - apiGroups: [""]
    resources: ["pods", "endpoints", "services", "nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["extensions", "networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-role-binding
subjects:
  - kind: ServiceAccount
    name: prometheus-sa
    namespace: verirag
roleRef:
  kind: ClusterRole
  name: prometheus-role
  apiGroup: rbac.authorization.k8s.io

---
# ── Prometheus Service ────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: prometheus-service
  namespace: verirag
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
  type: ClusterIP

---
# ── Grafana Deployment ────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: verirag
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:10.4.0
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: verirag-secrets
                  key: GRAFANA_ADMIN_PASSWORD
                  optional: true
            # Fallback password if secret not set
            - name: GF_SECURITY_ADMIN_USER
              value: "admin"
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_ANALYTICS_REPORTING_ENABLED
              value: "false"
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: storage
              mountPath: /var/lib/grafana
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "512Mi"
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: storage
          emptyDir: {}   # Use PVC in production for dashboard persistence

---
# ── Grafana Service ───────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: grafana-service
  namespace: verirag
spec:
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
  type: ClusterIP
  # To expose externally, change to LoadBalancer or add an Ingress rule.
  # For now: kubectl port-forward svc/grafana-service 3000:3000 -n verirag
