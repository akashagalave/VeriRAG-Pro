version: 0.0
os: linux
files:
  - source: /
    destination: /opt/verirag/backend
file_exists_behavior: OVERWRITE
hooks:
  BeforeInstall:
    - location: scripts/preflight.sh
      timeout: 120
      runas: root
  AfterInstall:
    - location: scripts/configure.sh
      timeout: 180
      runas: root
  ApplicationStart:
    - location: scripts/start.sh
      timeout: 300
      runas: root
  ValidateService:
    - location: scripts/validate.sh
      timeout: 180
      runas: root
