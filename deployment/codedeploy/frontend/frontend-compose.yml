services:
  streamlit:
    image: 372806411232.dkr.ecr.ap-south-1.amazonaws.com/verirag-frontend:${IMAGE_TAG:?Set IMAGE_TAG to the approved Git commit SHA}
    container_name: verirag-frontend
    ports:
      - "8501:8501"
    environment:
      BACKEND_URL: ${BACKEND_URL:?Set BACKEND_URL to the private backend address}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 45s
